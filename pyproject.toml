[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fast-pyroomacoustics"
version = "0.10.2.dev7+rust"
description = "Drop-in, faster pyroomacoustics: Rust core (optionally bit-exact) and a CUDA backend (PyTorch + Triton)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.13.0", "scipy>=0.18.0"]

[project.urls]
Repository = "https://github.com/popcornell/fast-pyroomacoustics"
Upstream = "https://github.com/LCAV/pyroomacoustics"

[project.optional-dependencies]
cuda = ["torch"]

[tool.maturin]
python-source = "python"
module-name = "pyroomacoustics.libroom"
features = ["pyo3/extension-module"]
include = [{ path = "python/pyroomacoustics/data/*.json", format = "wheel" }]
